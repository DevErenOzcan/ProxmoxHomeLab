---
- name: Reload network configuration
  listen: network_bridge_reload_now
  ansible.builtin.command: ifreload -a
  changed_when: true
  when: network_bridge_reload | default(true)

- name: Reload guest isolation rules
  listen: network_bridge_isolation_reload
  ansible.builtin.systemd_service:
    name: guest-isolation.service
    state: restarted
    daemon_reload: true
  when: not (ansible_check_mode and network_bridge_isolation_unit is changed)
