---
network_bridge_enabled: true
network_bridge_interfaces_file: /etc/network/interfaces
# Run "ifreload -a" after a change? If disabled, the bridge only appears after
# the next reboot.
network_bridge_reload: true
# Give the host an IPv6 link-local address on these bridges? Off: the bridges
# carry guests only, and the host must not be reachable from them except
# through the firewall.
network_bridge_host_ipv6: false
# One entry per bridge:
#   name          vmbrN
#   comment       written above the stanza in the interfaces file
#   ports         "none" for a port-less bridge
#   stp, fd       quoted "off" / 0 for a bridge without loops
#   gateway_port  optional: guests may talk to this port only (guest isolation)
network_bridges: []
