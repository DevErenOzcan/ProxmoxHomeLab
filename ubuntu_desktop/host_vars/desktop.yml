---
# =============================================================================
# ubuntu-desktop (VM 102) - the GPU workstation, and the controller
# =============================================================================
# Everything changed on top of the image VM 102 was built from:
# linuxcontainers' ubuntu/noble desktop build 20260912_07:42. The image's own
# defaults (GDM autologin as ubuntu, NOPASSWD sudo in /etc/sudoers.d/90-incus,
# the "distrobuilder-..." hostname, netplan's 10-lxc.yaml) are not repeated
# here. Inventoried from the running guest on 2026-10-03.

# --- Network -----------------------------------------------------------------
# On the home network (vmbr0), outside the firewall, at a static address -
# the home router cannot hold a reservation, and .202 is outside its DHCP
# pool. From here the controller reaches the Proxmox host and the firewall
# directly, and the segments behind the firewall through one route via its
# WAN address. The MAC is VM 102's (terraform/main.tf).
desktop_network:
  id: home-lan
  mac_address: "BC:24:11:B8:0E:F8"
  address: 192.168.1.202/24
  gateway: 192.168.1.1
  dns:
    - 192.168.1.1
  routes:
    - to: 10.10.0.0/16
      via: 192.168.1.201

# --- SSH ---------------------------------------------------------------------
# The image ships no openssh-server; it was installed at the console and the
# package list below keeps it. Nothing needs to log in here: this machine is
# the controller and runs its own playbook. The Windows workstation's WSL was
# the controller until 2026-10-22; its key is retired.
desktop_user: ubuntu
desktop_authorized_keys: []
desktop_revoked_authorized_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMCdb2x7BVEHm0qXNTy2RiEHRV+osCiw7DS5eBQD+yXE ansible-wsl"

# --- Third-party APT repositories ---------------------------------------------
# content is byte for byte what is on the machine. The Brave keyring is also
# owned by the brave-keyring package once brave-browser is installed.
desktop_apt_repos:
  - name: brave
    key_url: "https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg"
    key_path: /usr/share/keyrings/brave-browser-archive-keyring.gpg
    file: brave-browser-release.list
    content: |
      deb [arch=amd64 signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main
  - name: docker
    key_url: "https://download.docker.com/linux/ubuntu/gpg"
    key_path: /etc/apt/keyrings/docker.asc
    file: docker.sources
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: noble
      Components: stable
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/docker.asc
  # Terraform, for the controller this machine is. The key is ASCII-armoured,
  # hence .asc.
  - name: hashicorp
    key_url: "https://apt.releases.hashicorp.com/gpg"
    key_path: /etc/apt/keyrings/hashicorp.asc
    file: hashicorp.sources
    content: |
      Types: deb
      URIs: https://apt.releases.hashicorp.com
      Suites: noble
      Components: main
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/hashicorp.asc

# --- Packages ----------------------------------------------------------------
# Everything installed by hand after the image, in the order it happened
# (/var/log/apt/history.log). Docker Desktop was tried on 2026-09-22 and
# removed again the same evening; it is deliberately absent.
desktop_packages:
  - net-tools
  - brave-browser
  - openssh-server
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  # The image boots linux-image-virtual; the prebuilt NVIDIA modules below
  # are for the -generic kernel, which is what runs (6.8.0-142-generic).
  - linux-generic
  - linux-firmware
  - brightnessctl
  - nvidia-driver-595-open
  - linux-modules-nvidia-595-open-generic
  - gparted
  - nmap
  # The controller's tools (2026-10-22): the repo's venv, and Terraform from
  # HashiCorp's repository above.
  - python3-venv
  - terraform

desktop_snaps:
  - name: code
    classic: true
  - name: discord
  - name: proton-vpn

desktop_timezone: Europe/Istanbul
# nvidia-prime: the AMD iGPU drives the panel, the RTX renders on request.
desktop_prime_profile: on-demand
desktop_services_enabled:
  - docker

# --- GNOME -------------------------------------------------------------------
# The keys the ubuntu user's own dconf database holds (2026-10-03), installed
# as SYSTEM defaults (/etc/dconf/db/local.d). The user's values win
# wherever they exist, so this changes nothing on the running desktop and
# gives a rebuilt one the same setup. Values are GVariant text, as
# "dconf dump /" prints them.
#
# Left out on purpose: runtime state (numlock-state, mru-sources,
# app-picker-layout, window sizes), the RDP certificate paths, and the keys
# the tiling-assistant extension overrides and restores by itself. RDP also
# needs credentials, which live in the user's keyring and are set in
# Settings > System > Remote Desktop - never in this repo.
desktop_gnome_settings:
  org/gnome/desktop/datetime:
    automatic-timezone: "false"
  org/gnome/desktop/input-sources:
    sources: "[('xkb', 'tr')]"
    xkb-options: "@as []"
  org/gnome/desktop/interface:
    color-scheme: "'prefer-dark'"
    gtk-theme: "'Yaru-dark'"
    icon-theme: "'Yaru'"
  org/gnome/desktop/peripherals/touchpad:
    two-finger-scrolling-enabled: "true"
  org/gnome/desktop/remote-desktop/rdp:
    enable: "true"
    view-only: "false"
  org/gnome/desktop/screensaver:
    lock-enabled: "false"
  org/gnome/desktop/session:
    idle-delay: "uint32 0"
  org/gnome/settings-daemon/plugins/power:
    idle-dim: "true"
    sleep-inactive-ac-timeout: "3600"
    sleep-inactive-ac-type: "'nothing'"
  org/gnome/shell:
    enabled-extensions: "['ding@rastersoft.com', 'ubuntu-dock@ubuntu.com', 'tiling-assistant@ubuntu.com']"
    favorite-apps: "['org.gnome.Nautilus.desktop', 'brave-browser.desktop', 'snap-store_snap-store.desktop', 'yelp.desktop']"
  org/gnome/shell/extensions/dash-to-dock:
    dash-max-icon-size: "48"
  org/gnome/shell/extensions/tiling-assistant:
    active-window-hint-color: "'rgb(211,70,21)'"
    tiling-popup-all-workspace: "true"

# --- Data volume -------------------------------------------------------------
# The persistent 200 GB disk (VM 9102's, see terraform/main.tf, on the host's
# "vmdata" storage), mounted at /mnt/data. /home lives on it, so settings,
# browser profiles, ~/snap, anything installed into the home directory - and
# the controller's checkout of this repo with its Terraform state - survive a
# rebuilt VM. Apt packages, snaps and repositories do not need to: this file
# reinstalls them.
#
# Binding /home stops the graphical session and the user's own services (both
# keep files open there) and starts the display manager again afterwards. A
# terminal inside that session goes with it - see README.md, "Building it from
# nothing", for running the first bind from outside the session.
data_volume_label: desktop-data
data_volume_binds:
  - name: home
    path: /home
    stop: [display-manager.service, user@1000.service]
    start: [display-manager.service]
