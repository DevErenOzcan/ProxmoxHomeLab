---
# Storage configuration that differs from what the installer left.
#
# This role used to reclaim the first install's leftover volume group on
# nvme0n1 as a thin pool called "nvme2". There is no nvme2 today, and there
# cannot be one: nvme0n1 was repartitioned and is passed whole to VM 102 as its
# data disk. All that is left for the host to own is which content types
# "local" accepts.

- name: pve_storage | Read the local storage definition
  ansible.builtin.command: "pvesh get /storage/{{ pve_storage_local_id }} --output-format json"
  register: pve_storage_local
  changed_when: false
  check_mode: false

# pvesh returns the list in its own order ("backup,vztmpl,import,iso"), so the
# comparison is between sets.
- name: pve_storage | Set the content types of the local storage
  vars:
    _pve_storage_content_now: "{{ (pve_storage_local.stdout | from_json).content.split(',') | sort }}"
  ansible.builtin.command: >-
    pvesm set {{ pve_storage_local_id }}
    --content {{ pve_storage_local_content | join(',') }}
  changed_when: true
  when: _pve_storage_content_now != (pve_storage_local_content | sort)
