---
base_packages_dist_upgrade: true
base_packages_list:
  - git
  - dkms
  - build-essential
  - rsync
  - curl
  - gpg
  - ca-certificates

# Kernel headers (required by DKMS).
# WARNING: do NOT use 'proxmox-default-headers'. That meta package tracks PVE's
# default kernel (currently 6.14) while this host runs 7.0.2-6-pve, so it would
# install headers for the wrong kernel and the DKMS build would fail.
# The right answer is the exact running kernel plus the meta package for its
# ABI series.
base_packages_kernel_headers: []          # extra packages you want to add
base_packages_exact_kernel_headers: true  # proxmox-headers-<uname -r>
base_packages_abi_kernel_headers: true    # proxmox-headers-<major.minor>
