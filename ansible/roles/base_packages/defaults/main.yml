---
base_packages_dist_upgrade: true
base_packages_list:
  - git
  - dkms
  - build-essential
  - rsync
  - curl
  - gpg
  - ca-certificates

# Kernel headers (required by DKMS).
# Do NOT use 'proxmox-default-headers': that meta package tracks PVE's default
# kernel, which need not be the one this host runs (an opt-in 7.0 series while
# the default was 6.14), so it installs headers for the wrong kernel and the
# DKMS build fails. The right answer is the exact running kernel plus the meta
# package for its ABI series.
base_packages_kernel_headers: []          # extra packages you want to add
base_packages_exact_kernel_headers: true  # proxmox-headers-<uname -r>
base_packages_abi_kernel_headers: true    # proxmox-headers-<major.minor>
