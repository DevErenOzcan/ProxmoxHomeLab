---
# Handlers shared by gpu_passthrough and vendor_reset. The role has nothing
# else: list it in a play (playbooks/proxmox/30-gpu.yml) and both roles notify
# the same handlers, so the initramfs is rebuilt once instead of twice.
#
# Handlers run in the order they are DEFINED here, not in the order they were
# notified: grub first, then initramfs, and the reboot marker last
# (playbooks/proxmox/99-reboot.yml acts on it).

- name: Update GRUB
  listen: pve_update_grub
  ansible.builtin.command: update-grub
  changed_when: true
  notify: pve_reboot_required

- name: Rebuild initramfs for all kernels
  listen: pve_update_initramfs
  ansible.builtin.command: update-initramfs -u -k all
  changed_when: true
  notify: pve_reboot_required

- name: Mark reboot as required
  listen: pve_reboot_required
  ansible.builtin.copy:
    dest: /run/reboot-required
    content: "proxmox-homelab: kernel cmdline / modules / initramfs changed\n"
    mode: "0644"
