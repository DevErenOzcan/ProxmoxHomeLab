---
# Static routes on the host, so it can reach the segments behind the firewall
# as an Ansible controller.
#
# These used to be written into /etc/network/interfaces as "up ip route add"
# lines. That silently did nothing: blockinfile inserted them before the
# "source" line, which is outside any iface stanza, and ifupdown2 only honours
# up/down directives that sit INSIDE one. The route worked until the next
# reboot and then vanished, which is a worse failure than never working -
# everything is fine for days, then the controller quietly cannot reach a
# guest any more.
#
# A systemd unit avoids the whole question of where in that file a directive
# belongs, and it is easy to inspect: systemctl status homelab-routes.

- name: pve_routes | Remove the old interfaces-file route block
  ansible.builtin.blockinfile:
    path: /etc/network/interfaces
    marker: "# {mark} ANSIBLE MANAGED ROUTE {{ item.destination }}"
    state: absent
  loop: "{{ pve_routes }}"
  loop_control:
    label: "{{ item.destination }}"

- name: pve_routes | Install the route unit
  ansible.builtin.template:
    src: homelab-routes.service.j2
    dest: "{{ pve_routes_unit }}"
    owner: root
    group: root
    mode: "0644"
  register: pve_routes_unit_file

- name: pve_routes | Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: pve_routes_unit_file is changed

- name: pve_routes | Enable and start it
  ansible.builtin.systemd_service:
    name: "{{ pve_routes_unit | basename }}"
    enabled: true
    state: "{{ 'restarted' if pve_routes_unit_file is changed else 'started' }}"
  when: not ansible_check_mode

# The unit is what makes the routes survive a reboot; this proves they are in
# the kernel right now, which is what the rest of this run depends on.
- name: pve_routes | Confirm the routes are live
  ansible.builtin.command: "ip route show {{ item.destination }}"
  register: pve_routes_live
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ pve_routes }}"
  loop_control:
    label: "{{ item.destination }}"

- name: pve_routes | A route did not come up
  ansible.builtin.fail:
    msg: >-
      {{ item.item.destination }} is not in the routing table after starting
      {{ pve_routes_unit | basename }}. Check: systemctl status
      {{ pve_routes_unit | basename }}
  loop: "{{ pve_routes_live.results }}"
  loop_control:
    label: "{{ item.item.destination }}"
  when:
    - not ansible_check_mode
    - item.stdout | default('') | length == 0

- name: pve_routes | Reachability note
  ansible.builtin.debug:
    msg: >-
      Routes via {{ pve_routes | map(attribute='gateway') | unique | join(', ') }}
      are live and will survive a reboot. They only carry traffic while OPNsense
      is up and its WAN rule lets 192.168.1.0/24 into the lab segments. Note
      that the firewall does not answer ping on WAN by default - test with a
      TCP port, not ICMP, or you will misread a working firewall as a dead one.
