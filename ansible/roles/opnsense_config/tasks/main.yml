---
# Applies the firewall's configuration through the OPNsense REST API.
#
# Order of a run:
#   1. skip cleanly when there are no API credentials
#   2. read back what the API reports but cannot write - interface assignment
#      and addressing, gateways, hostname, services - and stop before changing
#      anything if it differs from the baseline in defaults/main.yml
#   3. write aliases before the rules that reference them, then the rules
#      (new and renamed ones before unused ones are removed), DNS, the Dnsmasq
#      settings, DHCP pools and reservations
#
# --check is a real dry run: step 2 is reads only, and the ansibleguy modules
# compare without writing in check mode, so every "changed" in a --check run
# is a difference between defaults/main.yml and the firewall.
#
# OPNsense 26.7 has no API-driven rollback: the savepoint endpoints went away
# with the os-firewall plugin. The safety net for a real run is a
# configuration backup taken beforehand (System -> Configuration -> Backups).
# The role is idempotent, so re-running after a failure is safe.
#
# The rules land in OPNsense's MVC filter, which is evaluated ahead of legacy
# GUI rules. Rules not declared here are left alone unless they are listed in
# opnsense_unused_rules.

- name: opnsense_config | Are the API credentials available
  ansible.builtin.set_fact:
    opnsense_have_credentials: >-
      {{ (opnsense_api_key | length > 0) and (opnsense_api_secret | length > 0) }}
  no_log: true

# Skipped rather than failed when unconfigured, unless opnsense_require_credentials
# says otherwise.
- name: opnsense_config | No API credentials, skipping the firewall
  ansible.builtin.debug:
    msg: |
      Skipping the firewall configuration: no OPNsense API credentials.

      Create them once in the GUI:
        System -> Access -> Users -> root -> "API keys" -> +
      That downloads a file with a key and a secret. Put both in .env,
      under exactly these names:
        OPNSENSE_API_KEY=...
        OPNSENSE_API_SECRET=...
      Then pass them to the run, from the ansible/ directory:
        env $(grep '^OPNSENSE_API_' ../.env) ANSIBLE_CONFIG=ansible.cfg ansible-playbook playbooks/opnsense/site.yml
      They are read as environment variables, so they never reach a disk or
      a command line.
  when: not opnsense_have_credentials

- name: opnsense_config | Credentials are required
  ansible.builtin.fail:
    msg: "opnsense_require_credentials is set, but there is no OPNSENSE_API_KEY / OPNSENSE_API_SECRET in the environment."
  when:
    - not opnsense_have_credentials
    - opnsense_require_credentials | bool

- name: opnsense_config | Configure the firewall
  when: opnsense_have_credentials
  # The connection arguments every API call shares, said once.
  module_defaults:
    ansibleguy.opnsense.alias: &opnsense_api
      firewall: "{{ opnsense_host }}"
      api_port: "{{ opnsense_port }}"
      api_key: "{{ opnsense_api_key }}"
      api_secret: "{{ opnsense_api_secret }}"
      ssl_verify: "{{ opnsense_ssl_verify }}"
    ansibleguy.opnsense.rule: *opnsense_api
    ansibleguy.opnsense.unbound_forward: *opnsense_api
    ansibleguy.opnsense.dnsmasq_range: *opnsense_api
    ansibleguy.opnsense.dnsmasq_host: *opnsense_api
    ansible.builtin.uri:
      url_username: "{{ opnsense_api_key }}"
      url_password: "{{ opnsense_api_secret }}"
      force_basic_auth: true
      validate_certs: "{{ opnsense_ssl_verify | bool }}"
      return_content: true
  block:

    - name: opnsense_config | Firewall is reachable
      ansible.builtin.wait_for:
        host: "{{ opnsense_host }}"
        port: "{{ opnsense_port }}"
        timeout: 15
      register: opnsense_reachable
      failed_when: false
      check_mode: false

    - name: opnsense_config | Firewall is not answering
      ansible.builtin.fail:
        msg: >-
          Nothing on {{ opnsense_host }}:{{ opnsense_port }}. Is the VM running,
          and has its WAN interface been given that address? See
          opnsense-bootstrap.md.
      when: opnsense_reachable is failed

    # ---- read back what the API cannot write --------------------------------
    # Assigning a NIC and addressing it are console/GUI jobs on 26.7, and so
    # are the gateway the console wizard creates, the hostname and sshd. The
    # API reports all of them, so they are checked rather than trusted.
    #
    # OPNsense labels these JSON responses text/html, so the uri module never
    # fills in .json - the content is parsed by hand.
    - name: opnsense_config | Read interfaces, gateways, system and services
      ansible.builtin.uri:
        url: "https://{{ opnsense_host }}:{{ opnsense_port }}/api/{{ item }}"
        method: GET
      loop:
        - interfaces/overview/export
        - routing/settings/searchGateway
        - diagnostics/system/systemInformation
        - core/service/search
      register: opnsense_reads
      changed_when: false
      check_mode: false
      no_log: true

    - name: opnsense_config | Index the responses by endpoint
      ansible.builtin.set_fact:
        opnsense_api: >-
          {{ dict(opnsense_reads.results | map(attribute='item')
                  | zip(opnsense_reads.results | map(attribute='content') | map('from_json'))) }}

    # A rule naming an unassigned interface can never succeed - and without
    # this check it fails once per rule, each time printing a page of httpx
    # internals for a condition one query answers.
    - name: opnsense_config | Every interface the rules name must be assigned
      vars:
        opnsense_assigned_ifaces: >-
          {{ opnsense_api['interfaces/overview/export']
             | map(attribute='identifier', default='')
             | reject('equalto', '') | sort | list }}
        opnsense_missing_ifaces: >-
          {{ opnsense_rules | map(attribute='interface') | unique | sort | list
             | difference(opnsense_assigned_ifaces) }}
      ansible.builtin.assert:
        that: opnsense_missing_ifaces | length == 0
        success_msg: "Interfaces present: {{ opnsense_assigned_ifaces | join(', ') }}"
        fail_msg: >-
          These rules name interfaces the firewall does not have:
          {{ opnsense_missing_ifaces | sort | join(', ') }}.
          Assigned right now: {{ opnsense_assigned_ifaces | join(', ') }}.
          Assigning a NIC is not in the API - do it in the GUI under
          Interfaces / Assignments, or at the console (opnsense-bootstrap.md).
          Nothing has been changed by this run.

    - name: opnsense_config | Interface assignment and addressing match the baseline
      vars:
        _live: >-
          {{ opnsense_api['interfaces/overview/export']
             | selectattr('identifier', 'equalto', item.id) | first | default({}) }}
        _cfg: "{{ _live.config | default({}) }}"
      ansible.builtin.assert:
        that:
          - _live.device | default('') == item.device
          - _live.addr4 | default('') == item.address
          - _cfg.gateway | default('') == item.gateway | default('')
          - (_cfg.blockbogons | default('') == '1') == (item.blockbogons | default(false))
          - (_cfg.blockpriv | default('') == '1') == (item.blockpriv | default(false))
        quiet: true
        fail_msg: >-
          {{ item.id }} differs from opnsense_baseline_interfaces. Expected
          {{ item.device }} {{ item.address }}, gateway
          '{{ item.gateway | default('') }}', blockbogons
          {{ item.blockbogons | default(false) }}, blockpriv
          {{ item.blockpriv | default(false) }}; the firewall has
          {{ _live.device | default('nothing assigned') }}
          {{ _live.addr4 | default('-') }}, gateway '{{ _cfg.gateway | default('') }}',
          blockbogons {{ _cfg.blockbogons | default('') == '1' }}, blockpriv
          {{ _cfg.blockpriv | default('') == '1' }}. These are console/GUI
          settings the API cannot write (opnsense-bootstrap.md) - fix the
          firewall, or the baseline if the firewall is right. Nothing has been
          changed.
      loop: "{{ opnsense_baseline_interfaces }}"
      loop_control:
        label: "{{ item.id }}"

    - name: opnsense_config | Gateways match the baseline
      vars:
        _gw: >-
          {{ opnsense_api['routing/settings/searchGateway'].rows
             | selectattr('name', 'equalto', item.name) | first | default({}) }}
      ansible.builtin.assert:
        that:
          - _gw.interface | default('') == item.interface
          - _gw.gateway | default('') == item.gateway
          - (_gw.defaultgw | default(false) | bool) == (item.default | default(false))
          - not (_gw.disabled | default(true) | bool)
        quiet: true
        fail_msg: >-
          Gateway {{ item.name }} differs from opnsense_baseline_gateways:
          expected {{ item.gateway }} on {{ item.interface }}
          (default {{ item.default | default(false) }}), the firewall has
          {{ _gw if _gw else 'no such gateway' }}. Nothing has been changed.
      loop: "{{ opnsense_baseline_gateways }}"
      loop_control:
        label: "{{ item.name }}"

    - name: opnsense_config | Hostname and running services match the baseline
      vars:
        _running: >-
          {{ opnsense_api['core/service/search'].rows
             | selectattr('running', 'equalto', 1) | map(attribute='name') | list }}
        _name: "{{ opnsense_api['diagnostics/system/systemInformation'].name | default('') }}"
      ansible.builtin.assert:
        that:
          - _name == opnsense_baseline_hostname
          - opnsense_baseline_services | difference(_running) | length == 0
        quiet: true
        fail_msg: >-
          Expected hostname {{ opnsense_baseline_hostname }} with
          {{ opnsense_baseline_services | join(', ') }} running; the firewall
          is {{ _name }} and runs {{ _running | join(', ') }}. Nothing has
          been changed.

    # ---- write ---------------------------------------------------------------
    # Aliases first: the rules below refer to them by name.
    - name: opnsense_config | Aliases
      ansibleguy.opnsense.alias:
        name: "{{ item.name }}"
        type: "{{ item.type }}"
        content: "{{ item.content }}"
        description: "{{ item.description | default(omit) }}"
        state: present
      loop: "{{ opnsense_aliases }}"
      loop_control:
        label: "{{ item.name }}"

    - name: opnsense_config | Firewall rules
      ansibleguy.opnsense.rule:
        action: "{{ item.action | default('pass') }}"
        description: "{{ item.description }}"
        sequence: "{{ item.sequence }}"
        interface: "{{ item.interface }}"
        direction: "{{ item.direction | default('in') }}"
        ip_protocol: "{{ item.ip_protocol | default(omit) }}"
        protocol: "{{ item.protocol | default(omit) }}"
        source_net: "{{ item.source_net | default(omit) }}"
        source_port: "{{ item.source_port | default(omit) }}"
        destination_net: "{{ item.destination_net | default(omit) }}"
        destination_port: "{{ item.destination_port | default(omit) }}"
        log: "{{ item.log | default(omit) }}"
        match_fields: ['description']
        enabled: true
        state: present
      loop: "{{ opnsense_rules }}"
      loop_control:
        label: "{{ item.interface }} {{ item.sequence }} {{ item.action }} - {{ item.description }}"

    # After the rules above, not before: a renamed rule is created first and
    # its old self removed second, so traffic never meets a gap.
    - name: opnsense_config | Remove unused firewall rules
      ansibleguy.opnsense.rule:
        description: "{{ item }}"
        match_fields: ['description']
        state: absent
      loop: "{{ opnsense_unused_rules }}"
      loop_control:
        label: "{{ item }}"

    - name: opnsense_config | Unbound forwarders
      ansibleguy.opnsense.unbound_forward:
        domain: ""
        target: "{{ item }}"
        state: present
      loop: "{{ opnsense_dns_forwarders }}"
      when: opnsense_dns_enabled | bool

    # The dnsmasq modules resolve an interface by its DISPLAY NAME, not by the
    # identifier the filter rules use: find_single_link() matches the option's
    # 'value' ("LAN", "OPT2"), so passing 'lan' comes back as "Provided
    # interface 'lan' was not found!" even though lan exists. Read the names
    # off the firewall instead of hardcoding them.
    - name: opnsense_config | Read the Dnsmasq settings
      ansible.builtin.uri:
        url: "https://{{ opnsense_host }}:{{ opnsense_port }}/api/dnsmasq/settings/get"
        method: GET
      register: opnsense_dnsmasq_settings
      changed_when: false
      check_mode: false
      no_log: true
      when: opnsense_dhcp_enabled | bool

    - name: opnsense_config | Map interface identifiers to Dnsmasq names
      vars:
        _dnsmasq: "{{ (opnsense_dnsmasq_settings.content | from_json).dnsmasq }}"
        _listening: >-
          {{ _dnsmasq.interface | dict2items
             | selectattr('value.selected', 'equalto', 1)
             | map(attribute='key') | sort }}
      ansible.builtin.set_fact:
        opnsense_dnsmasq_if: >-
          {{ dict(_dnsmasq.interface | dict2items | map(attribute='key') | list
                  | zip(_dnsmasq.interface | dict2items | map(attribute='value.value') | list)) }}
        opnsense_dnsmasq_live: "{{ _listening | join(',') }} port {{ _dnsmasq.port }}"
        opnsense_dnsmasq_drift: >-
          {{ _listening != (opnsense_dnsmasq_interfaces | sort)
             or (_dnsmasq.port | string) != (opnsense_dnsmasq_port | string) }}
      when: opnsense_dhcp_enabled | bool

    # A partial update: the settings API only touches the fields it is given,
    # so the rest of the page (DHCP options, logging, ...) stays as the GUI
    # left it. dnsmasq_general would rewrite all of it.
    - name: opnsense_config | Dnsmasq listen interfaces and DNS port
      ansible.builtin.uri:
        url: "https://{{ opnsense_host }}:{{ opnsense_port }}/api/dnsmasq/settings/set"
        method: POST
        body_format: json
        body:
          dnsmasq:
            interface: "{{ opnsense_dnsmasq_interfaces | join(',') }}"
            port: "{{ opnsense_dnsmasq_port | string }}"
      register: opnsense_dnsmasq_set
      changed_when: true
      failed_when: >-
        (opnsense_dnsmasq_set.content | default('{}') | from_json).result | default('')
        != 'saved'
      no_log: true
      when:
        - opnsense_dhcp_enabled | bool
        - opnsense_dnsmasq_drift | bool
        - not ansible_check_mode

    - name: opnsense_config | Apply the Dnsmasq settings
      ansible.builtin.uri:
        url: "https://{{ opnsense_host }}:{{ opnsense_port }}/api/dnsmasq/service/reconfigure"
        method: POST
        body_format: json
        body: {}
      changed_when: true
      no_log: true
      when: opnsense_dnsmasq_set is changed

    - name: opnsense_config | Dnsmasq settings would change
      ansible.builtin.debug:
        msg: >-
          Dnsmasq listens on {{ opnsense_dnsmasq_live }}; a real run sets
          {{ opnsense_dnsmasq_interfaces | join(',') }} port
          {{ opnsense_dnsmasq_port }}.
      changed_when: true
      when:
        - opnsense_dhcp_enabled | bool
        - opnsense_dnsmasq_drift | bool
        - ansible_check_mode

    - name: opnsense_config | DHCP pools
      ansibleguy.opnsense.dnsmasq_range:
        interface: "{{ opnsense_dnsmasq_if[opnsense_if[item.key]] }}"
        start_addr: "{{ item.value.dhcp_from }}"
        end_addr: "{{ item.value.dhcp_to }}"
        subnet_mask: "255.255.255.0"
        description: "{{ item.key | upper }} pool"
        # These ranges are IPv4, so ra_mode is never set - but the module
        # declares it as a list without a default, turns the unset value into
        # "" and compares that against the [] OPNsense stores. Left out, every
        # run reports "changed" and rewrites the range (and reloads dnsmasq).
        ra_mode: []
        state: present
      loop: "{{ opnsense_segments | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        - opnsense_dhcp_enabled | bool
        - item.value.dhcp_from | length > 0

    - name: opnsense_config | DHCP reservations
      ansibleguy.opnsense.dnsmasq_host:
        host: "{{ item.host }}"
        hardware_addr: "{{ item.hardware_addr }}"
        ip: "{{ item.ip }}"
        description: "{{ item.description | default(omit) }}"
        state: present
      loop: "{{ opnsense_dhcp_reservations }}"
      loop_control:
        label: "{{ item.host }} -> {{ item.ip }}"
      when: opnsense_dhcp_enabled | bool

- name: opnsense_config | Dry-run note
  ansible.builtin.debug:
    msg: >-
      Check mode: nothing was written. The baseline checks above were real
      reads, and every task that reports "changed" is a difference between
      defaults/main.yml and the firewall.
  when:
    - opnsense_have_credentials
    - ansible_check_mode
