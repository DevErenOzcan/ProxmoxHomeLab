---
# Applies the firewall's configuration through the OPNsense REST API.
#
# Safety model, in order:
#   1. skip cleanly when unconfigured, rather than half-applying
#   2. take a savepoint, so OPNsense reverts by itself if this run locks us out
#   3. write aliases before the rules that reference them
#   4. confirm the savepoint only once everything applied
#
# The rule module drives the os-firewall plugin's "Automation" ruleset, which
# is evaluated ahead of rules made in the GUI. Rules added by hand stay where
# they are; this role does not touch them.

- name: opnsense_config | Are the API credentials available
  ansible.builtin.set_fact:
    opnsense_have_credentials: >-
      {{ (opnsense_api_key | length > 0) and (opnsense_api_secret | length > 0) }}
  no_log: true

# Skipped rather than failed when unconfigured: a full converge should not go
# red on every run just because the one-time API key does not exist yet.
- name: opnsense_config | No API credentials, skipping the firewall
  ansible.builtin.debug:
    msg: |
      Skipping the firewall configuration: no OPNsense API credentials.

      Create them once in the GUI:
        System -> Access -> Users -> root -> "API keys" -> +
      That downloads a file with a key and a secret. Put both in .env:
        opnsense_api_key=...
        opnsense_api_secret=...
      state_push_ansible.sh forwards them to the host as environment
      variables; they never reach the host's disk or its argv.
  when: not opnsense_have_credentials

- name: opnsense_config | Credentials are required
  ansible.builtin.fail:
    msg: "opnsense_require_credentials is set, but .env has no opnsense_api_key / opnsense_api_secret."
  when:
    - not opnsense_have_credentials
    - opnsense_require_credentials | default(false) | bool

- name: opnsense_config | Configure the firewall
  when:
    - opnsense_have_credentials
    - not ansible_check_mode
  block:

    - name: opnsense_config | Firewall is reachable
      ansible.builtin.wait_for:
        host: "{{ opnsense_host }}"
        port: "{{ opnsense_port }}"
        timeout: 15
      register: opnsense_reachable
      failed_when: false

    - name: opnsense_config | Firewall is not answering
      ansible.builtin.fail:
        msg: >-
          Nothing on {{ opnsense_host }}:{{ opnsense_port }}. Is the VM running,
          and has its WAN interface been given that address? See docs/network.md.
      when: opnsense_reachable is failed

    # The connection arguments every module below shares. Defined once with a
    # YAML anchor and merged in with <<, so a changed address or key is a
    # one-line edit rather than twenty.
    - name: opnsense_config | Build the API connection
      ansible.builtin.set_fact:
        opn: &opn
          firewall: "{{ opnsense_host }}"
          port: "{{ opnsense_port }}"
          api_key: "{{ opnsense_api_key }}"
          api_secret: "{{ opnsense_api_secret }}"
          ssl_verify: "{{ opnsense_ssl_verify }}"
      no_log: true

    # The rule module talks to the os-firewall plugin's API, which is not part
    # of the base system.
    - name: opnsense_config | Install the os-firewall plugin
      ansibleguy.opnsense.package:
        name: os-firewall
        action: install
        <<: *opn
      when: opnsense_install_firewall_plugin

    # ---- the net under the trapeze ------------------------------------
    # OPNsense rolls the configuration back on its own if a savepoint is not
    # confirmed in time. That is the difference between "I locked myself out
    # of the firewall" and "it fixed itself a minute later".
    - name: opnsense_config | Take a savepoint
      ansibleguy.opnsense.savepoint:
        action: create
        <<: *opn
      register: opnsense_savepoint
      when: opnsense_use_savepoint

    - name: opnsense_config | Apply the configuration
      block:

        # Aliases first: the rules below refer to them by name.
        - name: opnsense_config | Aliases
          ansibleguy.opnsense.alias:
            name: "{{ item.name }}"
            type: "{{ item.type }}"
            content: "{{ item.content }}"
            description: "{{ item.description | default(omit) }}"
            state: present
            <<: *opn
          loop: "{{ opnsense_aliases }}"
          loop_control:
            label: "{{ item.name }}"

        - name: opnsense_config | Firewall rules
          ansibleguy.opnsense.rule:
            description: "{{ item.description }}"
            interface: "{{ item.interface }}"
            sequence: "{{ item.sequence }}"
            action: "{{ item.action }}"
            direction: "{{ item.direction | default('in') }}"
            protocol: "{{ item.protocol | default(omit) }}"
            source_net: "{{ item.source_net }}"
            source_port: "{{ item.source_port | default(omit) }}"
            destination_net: "{{ item.destination_net }}"
            destination_port: "{{ item.destination_port | default(omit) }}"
            log: "{{ item.log | default(false) }}"
            enabled: true
            state: present
            <<: *opn
          loop: "{{ opnsense_rules }}"
          loop_control:
            label: "{{ item.interface }} {{ item.sequence }} {{ item.action }} - {{ item.description }}"

        - name: opnsense_config | Unbound forwarders
          ansibleguy.opnsense.unbound_forward:
            domain: ""
            target: "{{ item }}"
            state: present
            <<: *opn
          loop: "{{ opnsense_dns_forwarders }}"
          when: opnsense_dns_enabled

        - name: opnsense_config | DHCP pools
          ansibleguy.opnsense.dnsmasq_range:
            interface: "{{ opnsense_if[item.key] }}"
            start_addr: "{{ item.value.dhcp_from }}"
            end_addr: "{{ item.value.dhcp_to }}"
            subnet_mask: "255.255.255.0"
            description: "{{ item.key | upper }} pool"
            state: present
            <<: *opn
          loop: "{{ opnsense_segments | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          when:
            - opnsense_dhcp_enabled
            - item.value.dhcp_from | length > 0

        - name: opnsense_config | DHCP reservations
          ansibleguy.opnsense.dnsmasq_host:
            host: "{{ item.host }}"
            hardware_addr: "{{ item.hardware_addr }}"
            ip: "{{ item.ip }}"
            description: "{{ item.description | default(omit) }}"
            state: present
            <<: *opn
          loop: "{{ opnsense_dhcp_reservations }}"
          loop_control:
            label: "{{ item.host }} -> {{ item.ip }}"
          when: opnsense_dhcp_enabled

      rescue:
        - name: opnsense_config | Roll back to the savepoint
          ansibleguy.opnsense.savepoint:
            action: revert
            revision: "{{ opnsense_savepoint.revision | default(omit) }}"
            <<: *opn
          when:
            - opnsense_use_savepoint
            - opnsense_savepoint.revision is defined

        - name: opnsense_config | Report the rollback
          ansible.builtin.fail:
            msg: >-
              Configuration failed. The firewall was rolled back to the
              savepoint taken at the start of this run, so nothing was left
              half applied.

    # Confirming is what stops OPNsense reverting on its own.
    - name: opnsense_config | Confirm the savepoint
      ansibleguy.opnsense.savepoint:
        action: apply
        revision: "{{ opnsense_savepoint.revision | default(omit) }}"
        <<: *opn
      when:
        - opnsense_use_savepoint
        - opnsense_savepoint.revision is defined

- name: opnsense_config | Dry-run note
  ansible.builtin.debug:
    msg: >-
      Check mode: this role talks to a live firewall over its API, so there is
      nothing to diff without making the calls. Run it for real to apply.
  when:
    - opnsense_have_credentials
    - ansible_check_mode
