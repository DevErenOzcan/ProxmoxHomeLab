---
# =============================================================================
# OPNsense configuration as code
# =============================================================================
# Everything below is applied through the OPNsense REST API by the
# ansibleguy.opnsense collection: aliases, filter rules, DNS forwarding, the
# Dnsmasq listen settings, DHCP pools and reservations.
#
# NOT covered, because the API does not expose it: assigning interfaces to
# NICs, their addresses, the WAN gateway, the hostname and sshd. Those are a
# one-time console/GUI job (opnsense-bootstrap.md); this role reads them back
# and refuses to run when they differ from the baseline at the bottom.

# --- connection -------------------------------------------------------------
opnsense_host: "192.168.1.201"
opnsense_port: 443
# Self-signed certificate on a lab firewall; nothing here crosses the internet.
opnsense_ssl_verify: false

# Credentials arrive as environment variables, so they never reach a disk or a
# command line. Nothing loads .env for you - prefix the run with them, from
# ansible/:
#   env $(grep '^OPNSENSE_API_' ../.env) ANSIBLE_CONFIG=ansible.cfg ansible-playbook playbooks/opnsense/site.yml
# Create the key once: GUI -> System -> Access -> Users -> root -> API keys -> +
opnsense_api_key: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
opnsense_api_secret: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
# Fail instead of skipping when the credentials are missing.
opnsense_require_credentials: false

# --- the network, mirroring terraform/environments/production/locals.tf -----
opnsense_home_lan: "192.168.1.0/24"
opnsense_lab_supernet: "10.10.0.0/16"

# OPNsense interface names, in the order the installer assigns them.
opnsense_if:
  wan: wan
  lan: lan
  dmz: opt1
  lab: opt2

opnsense_segments:
  lan: { cidr: "10.10.10.0/24", gateway: "10.10.10.1", dhcp_from: "10.10.10.100", dhcp_to: "10.10.10.245" }
  dmz: { cidr: "10.10.20.0/24", gateway: "10.10.20.1", dhcp_from: "", dhcp_to: "" }
  lab: { cidr: "10.10.30.0/24", gateway: "10.10.30.1", dhcp_from: "10.10.30.100", dhcp_to: "10.10.30.199" }

# --- aliases ----------------------------------------------------------------
opnsense_aliases:
  - name: HOME_LAN
    type: network
    content: ["{{ opnsense_home_lan }}"]
    description: "The house network the Proxmox host also lives on"
  - name: LAB_NETS
    type: network
    content: ["{{ opnsense_lab_supernet }}"]
    description: "Every internal segment, summarised"

# --- firewall rules ---------------------------------------------------------
# Order matters and is expressed by 'sequence'. The policy is asymmetric on
# purpose: LAN is trusted and talks to everything, the home network included,
# in both directions; DMZ and LAB may reach the internet and nothing else, so
# nothing there can open a connection into LAN or the home network. A stateful
# firewall needs only the initiating direction allowed; replies ride the
# existing state.
#
# WAN sequence 10 is the one that keeps you in the building. Do not remove it
# without another way to reach the GUI.
#
# 'log' defaults to true in the rule module, which is why every rule below
# logs unless it says otherwise. These are all the filter rules the firewall
# has (2026-10-03); there are no legacy GUI rules.
opnsense_rules:
  # ---- WAN -----------------------------------------------------------------
  - description: "Home LAN may reach this firewall's web UI"
    interface: "{{ opnsense_if.wan }}"
    sequence: 10
    action: pass
    direction: in
    protocol: TCP
    source_net: HOME_LAN
    destination_net: "(self)"
    destination_port: 443

  # Only the LAN: DMZ and LAB machines are reached through a LAN machine, so
  # nothing on the home network can open a connection into them directly.
  - description: "Home network may reach the LAN segment"
    interface: "{{ opnsense_if.wan }}"
    sequence: 11
    action: pass
    direction: in
    source_net: HOME_LAN
    destination_net: "{{ opnsense_segments.lan.cidr }}"

  # SSH from the home network. Enabled 2026-09-17 so the firewall can be
  # administered and driven by ansible without the console; it is declared here
  # rather than clicked into the GUI so it survives a converge and is visible
  # in review. Drop this entry to close it again.
  - description: "Home LAN may reach this firewall over SSH"
    interface: "{{ opnsense_if.wan }}"
    sequence: 12
    action: pass
    direction: in
    protocol: TCP
    source_net: HOME_LAN
    destination_net: "(self)"
    destination_port: 22

  # ---- LAN -----------------------------------------------------------------
  # The trusted segment (decision of 2026-10-03): every LAN machine may reach
  # the home network, this firewall, DMZ, LAB and the internet - one rule says
  # all of it. Traffic to the home network leaves NATed as 192.168.1.201.
  # Nothing comes back in unasked: DMZ and LAB block LAB_NETS at their own
  # sequence 30, which covers LAN. IPv4 only; nothing here uses IPv6.
  # Not logged, as the installer's allow-all it replaced was not: it matches
  # every LAN connection.
  - description: "LAN may reach anything"
    interface: "{{ opnsense_if.lan }}"
    sequence: 50
    action: pass
    direction: in
    source_net: "{{ opnsense_segments.lan.cidr }}"
    destination_net: any
    log: false

  # ---- DMZ -----------------------------------------------------------------
  # The segment Cloudflare Tunnel exposes, so the one most likely to be
  # compromised. Internet only.
  # TCP too: answers that do not fit a UDP datagram are retried over TCP.
  - description: "DMZ may use the gateway for DNS"
    interface: "{{ opnsense_if.dmz }}"
    sequence: 10
    action: pass
    direction: in
    protocol: TCP/UDP
    source_net: "{{ opnsense_segments.dmz.cidr }}"
    destination_net: "{{ opnsense_segments.dmz.gateway }}"
    destination_port: 53

  - description: "DMZ must not reach the home network"
    interface: "{{ opnsense_if.dmz }}"
    sequence: 20
    action: block
    direction: in
    source_net: "{{ opnsense_segments.dmz.cidr }}"
    destination_net: HOME_LAN
    log: true

  - description: "DMZ must not pivot into LAN or LAB"
    interface: "{{ opnsense_if.dmz }}"
    sequence: 30
    action: block
    direction: in
    source_net: "{{ opnsense_segments.dmz.cidr }}"
    destination_net: LAB_NETS
    log: true

  - description: "DMZ may reach the internet (cloudflared dials out on 443)"
    interface: "{{ opnsense_if.dmz }}"
    sequence: 40
    action: pass
    direction: in
    source_net: "{{ opnsense_segments.dmz.cidr }}"
    destination_net: any

  # ---- LAB -----------------------------------------------------------------
  - description: "LAB may use the gateway for DNS"
    interface: "{{ opnsense_if.lab }}"
    sequence: 10
    action: pass
    direction: in
    protocol: TCP/UDP
    source_net: "{{ opnsense_segments.lab.cidr }}"
    destination_net: "{{ opnsense_segments.lab.gateway }}"
    destination_port: 53

  - description: "LAB must not reach the home network"
    interface: "{{ opnsense_if.lab }}"
    sequence: 20
    action: block
    direction: in
    source_net: "{{ opnsense_segments.lab.cidr }}"
    destination_net: HOME_LAN
    log: true

  - description: "LAB is isolated from the other segments"
    interface: "{{ opnsense_if.lab }}"
    sequence: 30
    action: block
    direction: in
    source_net: "{{ opnsense_segments.lab.cidr }}"
    destination_net: LAB_NETS
    log: true

  - description: "LAB may reach the internet"
    interface: "{{ opnsense_if.lab }}"
    sequence: 40
    action: pass
    direction: in
    source_net: "{{ opnsense_segments.lab.cidr }}"
    destination_net: any

# Rules to delete from the firewall, by description. To rename a rule, change
# its description above and list the old one here: the new rule is written
# first, the old one removed after it. Empty once nothing is pending.
opnsense_unused_rules: []

# --- DNS --------------------------------------------------------------------
# The segments are firewalled off from the home router, so they cannot ask it
# directly. Unbound on the firewall (port 53) answers them and forwards
# everything to the home router - the firewall itself may talk to it.
opnsense_dns_enabled: true
opnsense_dns_forwarders:
  - "192.168.1.1"

# --- DHCP -------------------------------------------------------------------
# OPNsense 25.x removed ISC dhcpd; Dnsmasq serves DHCP here.
opnsense_dhcp_enabled: true

# Dnsmasq does DHCP only: its DNS listener is moved to 53053 because Unbound
# owns 53. It listens on the segments that have a pool - LAN and LAB; the DMZ
# has none. Written with a partial settings update, never dnsmasq_general,
# which rewrites the whole page with its own defaults (port 53 included).
opnsense_dnsmasq_interfaces:
  - "{{ opnsense_if.lan }}"
  - "{{ opnsense_if.lab }}"
opnsense_dnsmasq_port: 53053

# The description is the match key, so it stays as created even though VM 102
# boots a pre-built image rather than an installer ISO.
opnsense_dhcp_reservations:
  - host: ubuntu-desktop
    hardware_addr: "BC:24:11:B8:0E:F8"
    ip: "10.10.10.11"
    description: "GPU passthrough workstation - installer ISO, so no cloud-init to set an address"

# --- console/GUI baseline: verified, never written --------------------------
# What OPNsense 26.7's API can report but not write. These are set once at the
# console or in the GUI (opnsense-bootstrap.md); every run reads them back and
# stops before changing anything if they differ.
#
# blockpriv must stay false: WAN *is* the home network here, and "Block
# private networks" drops it with a quick rule ahead of every WAN pass rule
# (it locked every home-network client out of the firewall on 2026-09-17).
opnsense_baseline_hostname: "OPNsense.internal"
opnsense_baseline_interfaces:
  - id: "{{ opnsense_if.wan }}"
    device: vtnet0
    address: "{{ opnsense_host }}/24"
    gateway: WAN_GW
    blockbogons: true
    blockpriv: false
  - id: "{{ opnsense_if.lan }}"
    device: vtnet1
    address: "{{ opnsense_segments.lan.gateway }}/24"
  - id: "{{ opnsense_if.dmz }}"
    device: vtnet2
    address: "{{ opnsense_segments.dmz.gateway }}/24"
  - id: "{{ opnsense_if.lab }}"
    device: vtnet3
    address: "{{ opnsense_segments.lab.gateway }}/24"
opnsense_baseline_gateways:
  - name: WAN_GW
    interface: "{{ opnsense_if.wan }}"
    gateway: "192.168.1.1"   # the home router
    default: true
# sshd is what the WAN rule at sequence 12 exists for.
opnsense_baseline_services:
  - openssh
  - unbound
  - dnsmasq
