---
vendor_reset_enabled: true
vendor_reset_repo: "https://github.com/gnif/vendor-reset.git"
vendor_reset_version: "master"
vendor_reset_src_dir: "/usr/src/vendor-reset"
# So the role also works on its own, it installs its own prerequisites.
# Kernel headers are NOT installed here -- that is base_packages' job, because
# picking the right version requires querying the repositories.
vendor_reset_prereqs:
  - git
  - dkms
  - build-essential

# Force a clean re-clone, re-patch and re-register even when DKMS already has
# the module registered. Needed when upstream changes or one of the patches
# stops applying; a plain kernel upgrade does NOT need this.
vendor_reset_force_rebuild: false

# Extra modprobe options, e.g. "install_hook=1". Empty means no options file.
# Check what actually exists with:  modinfo -p vendor-reset
vendor_reset_module_options: ""
vendor_reset_modprobe_conf: /etc/modprobe.d/vendor-reset.conf
