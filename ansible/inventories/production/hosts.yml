---
# How to reach each managed machine. Settings live next to this file, in
# group_vars/<group>.yml.
all:
  children:
    proxmox_nodes:
      hosts:
        pve1:
          ansible_host: 192.168.1.200
          ansible_user: root
          ansible_python_interpreter: /usr/bin/python3
    ubuntu_desktop:
      hosts:
        desktop-vm:
          ansible_host: 10.10.10.11
          ansible_user: ubuntu
    # DMZ machines running Docker, each with its own Cloudflare Tunnel.
    docker_hosts:
      hosts:
        dmz-docker:
          ansible_host: 10.10.20.10
          ansible_user: ubuntu
    # Never connected to over SSH: playbooks/opnsense/site.yml runs on the
    # controller and talks to the firewall's REST API (group_vars/opnsense.yml).
    opnsense:
      hosts:
        firewall:
          ansible_host: 192.168.1.201
