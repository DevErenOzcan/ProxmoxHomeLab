---
# =============================================================================
# The Proxmox host, pve1 (192.168.1.200, node name "proxmox").
# =============================================================================
# Only what is specific to this machine lives here. Everything else is a role
# default (roles/<role>/defaults/main.yml) and is not repeated: change a value
# by adding it here, not by editing the role.
#
# Hardware: AMD Ryzen 7 5800H laptop, one wired NIC (nic0), two NVMe disks.

# --- Storage -----------------------------------------------------------------
# Proxmox owns only one of the two disks:
#
#   nvme1n1  Samsung 512 GB     the installer's LVM: "local" (dir) and
#                               "local-lvm" (thin pool "data" in VG "pve")
#   nvme0n1  Intel 670p 512 GB  NOT host storage. Passed whole to VM 102 as its
#                               data disk (terraform/modules/ubuntu_desktop);
#                               never add it to storage.cfg or touch it here.
#
# "import" is added to the installer's content types so Terraform can download
# disk images (proxmox_download_file with content_type = "import").
pve_storage_local_content:
  - iso
  - vztmpl
  - backup
  - import

# --- Network bridges -----------------------------------------------------------
# The internal segments OPNsense routes between. All are port-less and the host
# has no address on any of them: an address there would be a second path into
# the segments that bypasses the firewall. The host stays on vmbr0 so the
# Proxmox UI survives a dead firewall VM.
#
#   vmbr0  192.168.1.0/24   home network, host, firewall WAN (installer-made)
#   vmbr1  10.10.10.0/24    LAN  - trusted guests
#   vmbr2  10.10.20.0/24    DMZ  - internet-facing services
#   vmbr3  10.10.30.0/24    LAB  - experiments, quarantine
#
# Keep in step with terraform/environments/production/locals.tf, which assigns
# the addresses inside these segments.
#
# gateway_port: guests on that bridge may exchange frames with this port only,
# never with each other. It is OPNsense's NIC on the segment (VM 100 netN ->
# tap100iN); it becomes fwpr100pN if that NIC ever gets firewall=1.
network_bridges:
  - name: vmbr1
    comment: "LAN 10.10.10.0/24 - trusted guests, gateway 10.10.10.1 on OPNsense vtnet1"
    ports: "none"
    stp: "off"     # quoted: YAML turns bare off/on/no/yes into booleans
    fd: 0
  - name: vmbr2
    comment: "DMZ 10.10.20.0/24 - internet-facing services + cloudflared, gateway 10.10.20.1 on vtnet2"
    ports: "none"
    stp: "off"
    fd: 0
    gateway_port: tap100i2
  - name: vmbr3
    comment: "LAB 10.10.30.0/24 - experiments and quarantine, gateway 10.10.30.1 on vtnet3"
    ports: "none"
    stp: "off"
    fd: 0
    gateway_port: tap100i3

# --- GPU passthrough -------------------------------------------------------------
gpu_passthrough_grub_cmdline: "quiet amd_iommu=on iommu=pt pcie_acs_override=downstream,multifunction"
# The [vendor:device] pairs from "lspci -nn" bound to vfio-pci:
#   10de:25a0  NVIDIA GA107M / RTX 3050 Ti Mobile   (01:00.0)
#   1002:1638  AMD Cezanne iGPU                     (06:00.0)
#   1002:1637  AMD Renoir HD Audio                  (06:00.1)
#   1022:15e2  AMD Audio Coprocessor                (06:00.5)
#   1022:15e3  AMD Family 17h/19h HD Audio          (06:00.6)
#   1022:15df  AMD PSP/CCP crypto co-processor
#   14c3:7961  MediaTek MT7921 wireless
gpu_passthrough_pci_ids:
  - "10de:25a0"
  - "14c3:7961"
  - "1002:1637"
  - "1022:15df"
  - "1022:15e2"
  - "1022:15e3"
  - "1002:1638"

# --- Reboot ----------------------------------------------------------------------
# A converge that changes GRUB, kernel modules or the initramfs reboots the
# host on its own - but only when something left /run/reboot-required behind
# (apt also creates it when dist-upgrade pulls a new kernel), so a no-change run
# never reboots. Skip it for one run with -e pve_reboot_after_converge=false.
pve_reboot_after_converge: true
# shutdown -r +N gives open sessions N minutes' notice.
pve_reboot_delay_minutes: 1
