---
# The firewall group runs ON THE CONTROLLER, not on the firewall: the
# ansibleguy.opnsense modules call OPNsense's REST API, so
# playbooks/opnsense/site.yml uses "connection: local", and the address the API
# is reached at is opnsense_host (roles/opnsense_config/defaults/main.yml).
#
# The interpreter that must be able to "import httpx" is therefore the
# controller's: the repo's .venv. ansible_playbook_python is whichever python
# runs ansible, so it follows the venv without its path being hardcoded here.
# Interpreter discovery would pick the system /usr/bin/python3 instead, which
# has no httpx.
ansible_python_interpreter: "{{ ansible_playbook_python }}"
