---
# =============================================================================
# Reaching the guests: everything goes through pve1.
# =============================================================================
# The lab segments sit behind the firewall and only the Proxmox host has a
# route into 10.10.0.0/16 (roles/pve_routes adds it). A workstation running
# this playbook has none - the home router is not told about the lab - so the
# connection is jumped through pve1, which is reachable by key already.
#
# Drop this the day the home router carries "10.10.0.0/16 via 192.168.1.201";
# direct SSH works then and the jump is pure overhead.
ansible_ssh_common_args: >-
  -o ProxyJump=root@192.168.1.200
  -o StrictHostKeyChecking=accept-new

# --- Why this playbook cannot run yet (2026-09-17) --------------------------
# desktop-vm answers ping on 10.10.10.11 - the DHCP reservation works and the
# ARP entry matches VM 102's net0 (bc:24:11:b8:0e:f8) - but it has no listening
# port at all: 22, 80, 443, 3389 and 5900 are all closed from pve1.
#
# It never had a way in. VM 102 carries no cloud-init drive (no ciuser, no
# sshkeys, no ipconfig), which is the same limitation that made the static
# addressing fail: "local" has no snippets content type, so user_data cannot be
# attached. And Ubuntu Desktop does not ship openssh-server.
#
# It is also a GPU-passthrough workstation (hostpci0 with x-vga=1), so its
# screen is the physical monitor, not the Proxmox console. One session at that
# machine is what unblocks the rest:
#
#   sudo apt install -y openssh-server
#   install -d -m 700 -o ubuntu -g ubuntu ~ubuntu/.ssh
#   # append the controller's public key to ~ubuntu/.ssh/authorized_keys
#
# After that, this playbook runs from here through the jump above.
