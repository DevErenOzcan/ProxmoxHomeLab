---
# Alternative inventory: run the playbooks from a separate control machine over
# SSH. Ansible has no Windows controller, so this only works from WSL, Linux or
# macOS:
#
#   ansible-playbook -i inventory/remote.yml site.yml
all:
  children:
    proxmox_nodes:
      hosts:
        pve1:
          ansible_host: 192.168.1.200
          ansible_user: root
          ansible_python_interpreter: /usr/bin/python3
