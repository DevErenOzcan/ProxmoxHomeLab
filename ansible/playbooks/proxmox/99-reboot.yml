---
# Reboots the host only when a reboot is actually pending, i.e. something left
# /run/reboot-required behind: GRUB, kernel modules or the initramfs
# (roles/pve_common), or a new kernel from dist-upgrade. A no-change converge
# never reboots. Controlled by pve_reboot_after_converge.
- name: Reboot handling
  hosts: proxmox_nodes
  become: true
  gather_facts: false
  tags: [always]
  tasks:
    - name: reboot | Check whether a reboot is pending
      ansible.builtin.stat:
        path: /run/reboot-required
      register: reboot_marker

    - name: reboot | Report reboot status
      ansible.builtin.debug:
        msg: >-
          {{ 'REBOOT REQUIRED - kernel cmdline / modules / initramfs changed.'
             if reboot_marker.stat.exists
             else 'No reboot required.' }}

    - name: reboot | Schedule the reboot
      ansible.builtin.command: "shutdown -r +{{ pve_reboot_delay_minutes | default(1) }} 'proxmox-homelab: rebooting after ansible converge'"
      changed_when: true
      register: reboot_scheduled
      when:
        - reboot_marker.stat.exists
        - pve_reboot_after_converge | default(true) | bool

    - name: reboot | Announce the reboot
      ansible.builtin.debug:
        msg: >-
          Host reboots in {{ pve_reboot_delay_minutes | default(1) }} minute(s).
          Cancel with 'shutdown -c' on the host if you need to.
      when: reboot_scheduled is changed

    - name: reboot | Remind how to reboot
      ansible.builtin.debug:
        msg: >-
          Reboot was skipped (pve_reboot_after_converge is false).
          Reboot the host later with:  reboot
      when:
        - reboot_marker.stat.exists
        - not (pve_reboot_after_converge | default(true) | bool)
