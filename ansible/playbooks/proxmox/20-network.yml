---
# The port-less bridges the guests attach to (vmbr1-3), with the host's IPv6
# off on them and DMZ/LAB guests isolated from each other.
- name: Network bridges
  hosts: proxmox_nodes
  become: true
  gather_facts: true
  roles:
    - role: network_bridge
      tags: [network]
      when: network_bridge_enabled | bool
