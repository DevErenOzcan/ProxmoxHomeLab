---
# IOMMU, vfio-pci and vendor-reset. A reboot is required after changes here.
#
# The two roles share one play on purpose: both notify the initramfs handler
# from pve_common, and within a single play that handler runs once.
- name: GPU passthrough and AMD vendor-reset
  hosts: proxmox_nodes
  become: true
  gather_facts: true
  roles:
    - role: pve_common
      tags: [always]
    - role: gpu_passthrough
      tags: [gpu]
      when: gpu_passthrough_enabled | bool
    - role: vendor_reset
      tags: [gpu]
      when: vendor_reset_enabled | bool
