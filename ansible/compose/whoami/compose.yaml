# A smoke test for the tunnel: answers every request with what it received.
# Give the tunnel a public hostname pointing at http://whoami:80; once that
# answers, drop this project and add real services the same way - a directory
# here, an entry in group_vars/docker_hosts.yml, the "edge" network, and no
# published ports.
name: whoami

services:
  whoami:
    image: traefik/whoami:v1.12.0
    restart: unless-stopped
    networks: [edge]

networks:
  edge:
    external: true
