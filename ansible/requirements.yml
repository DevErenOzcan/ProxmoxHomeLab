---
# Galaxy collections the CONTROLLER needs - the machine running
# ansible-playbook. Install them into the repo's virtualenv with
# "./run_ansible.sh --setup"; roles/ansible_deps does the same on the Proxmox
# host for the runs that are driven from there.
#
# Collections are resolved on the controller (ansible ships the module to the
# target), so this list has nothing to do with what the managed hosts have.
# It matters more since ansible-core lives in a virtualenv: the distro's
# /usr/lib/python3/dist-packages/ansible_collections tree - which is where
# apt's "ansible" package keeps ansible.posix and friends - is NOT visible
# from the venv. Anything not listed here does not exist.
collections:
  # Configures OPNsense through its REST API: aliases, firewall rules, DHCP,
  # Unbound, NAT, Suricata. Everything the firewall needs except interface
  # assignment and addressing, which the API does not expose.
  - name: ansibleguy.opnsense
    version: ">=1.2.16"

  # ansible.posix.mount, used by roles/desktop_data_volume to mount the
  # detached data volume. Comes free with apt's "ansible" package, so it was
  # never listed - a venv controller has to install it explicitly.
  - name: ansible.posix
    version: ">=1.5.4"

  # community.general.filesystem, used by roles/desktop_data_volume to mkfs the
  # detached data volume. The task used to say "ansible.builtin.filesystem",
  # which is not a module that exists in any ansible-core; it went unnoticed
  # because the play targeted a host pattern the inventory has no match for, so
  # its tasks were never resolved.
  - name: community.general
    version: ">=8.0.0"
